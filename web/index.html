<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Bule — offline-first language learning.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Bule">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Bule</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      background: #faf8f2;
      height: 100%;
      margin: 0;
    }

    .bule-loader {
      align-items: center;
      color: #1c1c1e;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      inset: 0;
      justify-content: center;
      position: fixed;
    }

    .bule-loader img {
      border-radius: 24px;
      height: 112px;
      width: 112px;
    }

    .bule-loader h1 {
      font-size: 32px;
      margin: 20px 0 8px;
    }

    .bule-loader p {
      color: #636366;
      font-size: 15px;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="bule-loader" id="bule-loader" role="status" aria-label="Loading Bule">
    <img src="icons/Icon-192.png" alt="Bule teapot logo">
    <h1>Bule</h1>
    <p>Your language learning space</p>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('bule-loader')?.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
